[profile.default]
solc-version = '0.8.22'
src = 'contracts'
out = 'out'
test = 'test/foundry'
cache_path = 'cache/foundry'
optimizer = true
optimizer_runs = 20_000

# Migration.t.sol reads the Safe batches emitted by the freeze/seed tasks to check the calldata it
# executes matches what those tasks actually produce.
fs_permissions = [{ access = "read", path = "./" }]

libs = [
    # We provide a set of useful contract utilities
    # in the lib directory of @layerzerolabs/toolbox-foundry:
    # 
    # - forge-std
    # - ds-test
    # - solidity-bytes-utils
    'node_modules/@layerzerolabs/toolbox-foundry/lib',
    'node_modules',
]

remappings = [
    # Due to a misconfiguration of solidity-bytes-utils, an outdated version
    # of forge-std is being dragged in
    # 
    # To remedy this, we'll remap the ds-test and forge-std imports to our own versions
    'ds-test/=node_modules/@layerzerolabs/toolbox-foundry/lib/ds-test',
    'forge-std/=node_modules/@layerzerolabs/toolbox-foundry/lib/forge-std',
    '@layerzerolabs/=node_modules/@layerzerolabs/',
    '@openzeppelin/=node_modules/@openzeppelin/',
]

# Fork targets. Public endpoints, each confirmed responding; fork tests skip when unreachable.
[rpc_endpoints]
# publicnode refuses the historical state a fork needs ("Archive requests require a personal token").
ethereum = "https://eth.drpc.org"
flare = "https://flare-api.flare.network/ext/C/rpc"
hyperevm = "https://rpc.hyperliquid.xyz/evm"
derive = "https://rpc.lyra.finance"
